version: 1
applications:
  - appRoot: apps/app
    frontend:
      buildPath: /
      phases:
        preBuild:
          commands:
            - curl -fsSL https://bun.sh/install | bash
            - export BUN_INSTALL="$HOME/.bun"
            - export PATH="$BUN_INSTALL/bin:$PATH"
            # Drop cached node_modules so workspace packages (e.g. @uprevit/ui exports)
            # are always re-linked from the current commit. Stale caches can omit new
            # package exports like ./components/common/Icon and break Amplify builds.
            - rm -rf node_modules apps/*/node_modules packages/*/node_modules
            - bun install --frozen-lockfile
        build:
          commands:
            - export BUN_INSTALL="$HOME/.bun"
            - export PATH="$BUN_INSTALL/bin:$PATH"
            - bun run --cwd apps/app build
      artifacts:
        baseDirectory: apps/app/.next
        files:
          - "**/*"
      cache:
        paths:
          - .bun/install/cache/**/*
          - .turbo/**/*
          - apps/app/.next/cache/**/*

  - appRoot: apps/marketing
    frontend:
      buildPath: /
      phases:
        preBuild:
          commands:
            - curl -fsSL https://bun.sh/install | bash
            - export BUN_INSTALL="$HOME/.bun"
            - export PATH="$BUN_INSTALL/bin:$PATH"
            - rm -rf node_modules apps/*/node_modules packages/*/node_modules
            - bun install --frozen-lockfile
        build:
          commands:
            - export BUN_INSTALL="$HOME/.bun"
            - export PATH="$BUN_INSTALL/bin:$PATH"
            - bun run --cwd apps/marketing build
      artifacts:
        baseDirectory: apps/marketing/.next
        files:
          - "**/*"
      cache:
        paths:
          - .bun/install/cache/**/*
          - .turbo/**/*
          - apps/marketing/.next/cache/**/*
