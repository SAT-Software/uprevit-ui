version: 1
applications:
  - appRoot: apps/app
    frontend:
      buildPath: /
      phases:
        preBuild:
          commands:
            - nvm use 22
            - curl -fsSL https://get.pnpm.io/install.sh | env PNPM_VERSION=11.21.0 sh -
            - export PNPM_HOME="$HOME/.local/share/pnpm"
            - export PATH="$PNPM_HOME:$PATH"
            # Drop cached node_modules so workspace packages (e.g. @uprevit/ui exports)
            # are always re-linked from the current commit. Stale caches can omit new
            # package exports like ./components/common/Icon and break Amplify builds.
            - rm -rf node_modules apps/*/node_modules packages/*/node_modules
            - pnpm install --frozen-lockfile --store-dir .pnpm-store
        build:
          commands:
            - nvm use 22
            - export PNPM_HOME="$HOME/.local/share/pnpm"
            - export PATH="$PNPM_HOME:$PATH"
            - pnpm run build:app
      artifacts:
        baseDirectory: apps/app/.next
        files:
          - "**/*"
      cache:
        paths:
          - .pnpm-store/**/*
          - .turbo/**/*
          - apps/app/.next/cache/**/*

  - appRoot: apps/marketing
    frontend:
      buildPath: /
      phases:
        preBuild:
          commands:
            - nvm use 22
            - curl -fsSL https://get.pnpm.io/install.sh | env PNPM_VERSION=11.21.0 sh -
            - export PNPM_HOME="$HOME/.local/share/pnpm"
            - export PATH="$PNPM_HOME:$PATH"
            - rm -rf node_modules apps/*/node_modules packages/*/node_modules
            - pnpm install --frozen-lockfile --store-dir .pnpm-store
        build:
          commands:
            - nvm use 22
            - export PNPM_HOME="$HOME/.local/share/pnpm"
            - export PATH="$PNPM_HOME:$PATH"
            - pnpm run build:marketing
      artifacts:
        baseDirectory: apps/marketing/.next
        files:
          - "**/*"
      cache:
        paths:
          - .pnpm-store/**/*
          - .turbo/**/*
          - apps/marketing/.next/cache/**/*
