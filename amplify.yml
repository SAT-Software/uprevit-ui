version: 1
applications:
  - appRoot: apps/app
    frontend:
      buildPath: /
      phases:
        preBuild:
          commands:
            - nvm use 24
            - corepack enable pnpm
            - corepack install
            # Drop cached node_modules so workspace packages (e.g. @uprevit/ui exports)
            # are always re-linked from the current commit. Stale caches can omit new
            # package exports like ./components/common/Icon and break Amplify builds.
            # Turbopack's build cache stores absolute paths and Amplify builds in a new
            # directory each run, so a restored .next/cache breaks the build.
            - rm -rf node_modules apps/*/node_modules packages/*/node_modules apps/*/.next/cache
            - pnpm install --frozen-lockfile --store-dir .pnpm-store
        build:
          commands:
            - nvm use 24
            - env | sed -nE '/^(OPENROUTER_(API_KEY|MODEL)|API_PROXY_TARGET)=/p' >> apps/app/.env.production
            - pnpm run build:app
      artifacts:
        baseDirectory: apps/app/.next
        files:
          - "**/*"
      cache:
        paths:
          - .pnpm-store/**/*
          - .turbo/**/*

  - appRoot: apps/marketing
    frontend:
      buildPath: /
      phases:
        preBuild:
          commands:
            - nvm use 24
            - corepack enable pnpm
            - corepack install
            - rm -rf node_modules apps/*/node_modules packages/*/node_modules apps/*/.next/cache
            - pnpm install --frozen-lockfile --store-dir .pnpm-store
        build:
          commands:
            - nvm use 24
            - pnpm run build:marketing
      artifacts:
        baseDirectory: apps/marketing/.next
        files:
          - "**/*"
      cache:
        paths:
          - .pnpm-store/**/*
          - .turbo/**/*
